<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MU/TH/UR 6000 // Alien (1979) Quote Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

        :root {
            --term-green: #33ff66;
            --term-dim-green: #1b8a37;
            --term-bg: #050b06;
            --term-amber: #ffb000;
        }

        body {
            background-color: var(--term-bg);
            color: var(--term-green);
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }

        /* CRT Scanline effect */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.4) 50%,
                rgba(0, 0, 0, 0.4)
            );
            background-size: 100% 4px;
        }

        /* Screen glow effect */
        .glow-text {
            text-shadow: 0 0 8px rgba(51, 255, 102, 0.65), 0 0 20px rgba(51, 255, 102, 0.2);
        }
        
        .glow-amber {
            color: var(--term-amber);
            text-shadow: 0 0 8px rgba(255, 176, 0, 0.65);
        }

        .crt-border {
            border: 1px solid var(--term-dim-green);
            box-shadow: inset 0 0 15px rgba(51, 255, 102, 0.1), 0 0 15px rgba(0, 0, 0, 0.8);
        }

        /* Terminal cursor animation */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.1em;
            background-color: var(--term-green);
            vertical-align: middle;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Button interactions */
        .terminal-btn {
            background-color: rgba(51, 255, 102, 0.05);
            border: 1px solid var(--term-green);
            transition: all 0.2s ease;
        }

        .terminal-btn:hover {
            background-color: var(--term-green);
            color: #050b06;
            box-shadow: 0 0 12px rgba(51, 255, 102, 0.8);
        }

        .terminal-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8 select-none relative">
    
    <!-- CRT Overlay Layer -->
    <div class="pointer-events-none fixed inset-0 scanlines z-50 opacity-40"></div>

    <!-- Header / System Status -->
    <header class="max-w-4xl mx-auto w-full flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-[#1b8a37] pb-4 mb-6 text-xs sm:text-sm tracking-widest opacity-80">
        <div>
            <span class="text-white font-bold">WEYLAND-YUTANI CORP</span> // Nostromo Commercial Starship
        </div>
        <div class="mt-2 sm:mt-0 flex items-center space-x-3">
            <span class="inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span>MU/TH/UR 6000 ONLINE</span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto w-full my-auto py-6">
        <div class="crt-border bg-black/40 p-6 sm:p-10 rounded-lg relative backdrop-blur-sm">
            
            <!-- System Interface Metadata Header -->
            <div class="flex justify-between items-center text-xs tracking-wider border-b border-[#1b8a37]/50 pb-3 mb-6 opacity-75">
                <span>PRIORITY 1 LOG ENTRY</span>
                <span id="log-timestamp">CREW COMM LOG #79-0525</span>
            </div>

            <!-- Quote Display Area -->
            <div class="min-h-[160px] flex flex-col justify-center my-4">
                <blockquote class="text-xl sm:text-2xl md:text-3xl leading-relaxed glow-text font-normal tracking-wide">
                    "<span id="quote-text">Loading communication archive...</span>"
                </blockquote>
                
                <div class="mt-6 text-right">
                    <span class="text-sm sm:text-base font-bold tracking-widest glow-amber uppercase" id="quote-speaker">
                        — SYSTEM INITIALIZING
                    </span>
                    <span class="text-xs block opacity-60 mt-1" id="speaker-title">Commercial Starship Nostromo</span>
                </div>
            </div>

            <!-- Terminal Cursor Indicator -->
            <div class="mt-4 pt-4 border-t border-[#1b8a37]/30 flex items-center justify-between text-xs opacity-70">
                <div class="flex items-center">
                    <span class="mr-2">&gt; INTERROGATING DATABASE</span>
                    <span class="cursor"></span>
                </div>
                <div id="quote-counter">LOG 1/14</div>
            </div>

        </div>

        <!-- Interactive Control Panel -->
        <div class="mt-8 flex flex-col sm:flex-row justify-center items-center gap-4">
            <button id="next-btn" class="terminal-btn px-8 py-3 w-full sm:w-auto font-bold tracking-widest text-sm uppercase rounded focus:outline-none">
                [ TRANSMIT NEW QUOTE ]
            </button>
            <button id="sound-toggle" class="px-4 py-3 w-full sm:w-auto text-xs tracking-wider border border-[#1b8a37] hover:border-green-400 opacity-70 hover:opacity-100 transition rounded">
                AUDIO BEEP: <span id="sound-status">ON</span>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full border-t border-[#1b8a37] pt-4 mt-6 text-center text-xs opacity-60 tracking-wider">
        <p>ALIEN (1979) DIRECTED BY RIDLEY SCOTT — CREW EXPENSIBLE</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Authentic quotes strictly from Alien (1979)
        const ALIEN_QUOTES = [
            {
                quote: "You still don't understand what you're dealing with, do you? The perfect organism. Its structural perfection is matched only by its hostility.",
                speaker: "Ash",
                role: "Science Officer"
            },
            {
                quote: "I can't lie to you about your chances, but... you have my sympathies.",
                speaker: "Ash",
                role: "Science Officer"
            },
            {
                quote: "Priority One: Insure return of organism for analysis. All other considerations secondary. Crew expendable.",
                speaker: "MU/TH/UR 6000",
                role: "Mainframe Interface"
            },
            {
                quote: "Final report of the commercial starship Nostromo, third officer reporting. The other members of the crew — Kane, Lambert, Parker, Brett, Ash and Captain Dallas — are dead. Cargo and ship destroyed. This is Ripley, last survivor of the Nostromo, signing off.",
                speaker: "Ellen Ripley",
                role: "Warrant Officer"
            },
            {
                quote: "When Dallas lay down the order, he was right. If we break quarantine, we might all die.",
                speaker: "Ellen Ripley",
                role: "Warrant Officer"
            },
            {
                quote: "What's the story, Mother?",
                speaker: "Dallas",
                role: "Captain"
            },
            {
                quote: "I don't know. We're not halfway home. We're only a third of the way home.",
                speaker: "Dallas",
                role: "Captain"
            },
            {
                quote: "If we touch it, we might be breaking the law. What about our shares?",
                speaker: "Parker",
                role: "Chief Engineer"
            },
            {
                quote: "Why don't we just freeze him?",
                speaker: "Parker",
                role: "Chief Engineer"
            },
            {
                quote: "Let's get out of here. Let's take the shuttle and get out of here!",
                speaker: "Lambert",
                role: "Navigator"
            },
            {
                quote: "Right.",
                speaker: "Brett",
                role: "Engineering Technician"
            },
            {
                quote: "It's got a shell of polymerized silicone. It protects him from any environment.",
                speaker: "Kane",
                role: "Executive Officer"
            },
            {
                quote: "Whenever Parker touches anything, we're in trouble.",
                speaker: "Ellen Ripley",
                role: "Warrant Officer"
            },
            {
                quote: "Emergency self-destruct sequence initiated. T-minus five minutes.",
                speaker: "MU/TH/UR 6000",
                role: "Mainframe Interface"
            }
        ];

        let lastIndex = -1;
        let audioEnabled = true;

        // Simple Web Audio Synthesizer for Retro Terminal Clicks
        function playBeep(freq = 800, duration = 0.04) {
            if (!audioEnabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {
                // Audio context might be restricted before user gesture
            }
        }

        // Get non-repeating random index
        function getRandomIndex() {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * ALIEN_QUOTES.length);
            } while (nextIndex === lastIndex && ALIEN_QUOTES.length > 1);
            lastIndex = nextIndex;
            return nextIndex;
        }

        // Render quote with subtle typewriter animation
        function displayQuote() {
            const index = getRandomIndex();
            const quoteData = ALIEN_QUOTES[index];
            
            const textEl = document.getElementById('quote-text');
            const speakerEl = document.getElementById('quote-speaker');
            const titleEl = document.getElementById('speaker-title');
            const counterEl = document.getElementById('quote-counter');
            
            playBeep(1200, 0.03);

            // Fast display text fade
            textEl.style.opacity = '0';
            setTimeout(() => {
                textEl.textContent = quoteData.quote;
                speakerEl.textContent = `— ${quoteData.speaker}`;
                titleEl.textContent = `${quoteData.role} // USCSS Nostromo`;
                counterEl.textContent = `LOG ${index + 1}/${ALIEN_QUOTES.length}`;
                textEl.style.opacity = '1';
                playBeep(600, 0.05);
            }, 100);
        }

        // Event listeners
        document.getElementById('next-btn').addEventListener('click', displayQuote);
        
        document.getElementById('sound-toggle').addEventListener('click', () => {
            audioEnabled = !audioEnabled;
            document.getElementById('sound-status').textContent = audioEnabled ? 'ON' : 'OFF';
            if (audioEnabled) playBeep(900, 0.05);
        });

        // Initialize on page load
        window.onload = () => {
            displayQuote();
        };
    </script>
</body>
</html>
